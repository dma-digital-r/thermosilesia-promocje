<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Promocje dla instalatorów — Thermosilesia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ============================================================ HEADER -->
  <header class="topbar">
    <div class="brand-current" id="brandCurrent">
      <span class="brand-logo" id="brandLogo"></span>
      <span class="month-tag" id="monthBadge">Promocje — Sierpień 2026</span>
    </div>

    <div class="topbar-center">
      <div class="weather-strip" id="weatherStrip">
        <span class="weather-loading">Ładowanie pogody…</span>
      </div>
    </div>

    <div class="topbar-right">
      <div class="clock-wrap">
        <span class="clock" id="clock">--:--</span>
        <span class="clock-date" id="clockDate"></span>
      </div>
      <div class="brand-switch" id="brandSwitch"></div>
    </div>
  </header>

  <!-- ============================================================ STAGE -->
  <main class="stage" id="stage">
    <div class="bg-layer" id="bgLayerA"></div>
    <div class="bg-layer" id="bgLayerB"></div>
    <div class="bg-particles" id="particles"></div>
    <div class="bg-vignette"></div>

    <div class="hero" id="hero">

      <div class="hero-visual" id="heroVisual">
        <div class="visual-glow" id="visualGlow"></div>
        <div class="visual-frame" id="visualFrame">
          <span class="frame-corner tl"></span>
          <span class="frame-corner tr"></span>
          <span class="frame-corner bl"></span>
          <span class="frame-corner br"></span>
          <img class="visual-photo" id="heroPhoto" alt="">
          <div class="visual-icon" id="heroIcon"></div>
        </div>
      </div>
      <div class="bg-scrim"></div>

      <div class="hero-content" id="heroCard">
        <div class="hero-eyebrow-row">
          <span class="hero-kicker" id="heroKicker">Promocja</span>
        </div>
        <h1 class="hero-title" id="heroTitle">Ładowanie…</h1>
        <p class="hero-tagline" id="heroTagline"></p>

        <div class="hero-badges" id="heroBadges"></div>

        <div class="hero-price-row">
          <div class="price-col price-col--main">
            <p class="price-col-title" id="priceLabel">Cena</p>
            <div class="price-value-row">
              <span class="price-prefix" id="pricePrefix">Już od:</span>
              <span class="price-value"><span id="priceNumber">0</span><span class="price-suffix" id="priceSuffix"></span></span>
            </div>
            <p class="price-col-caption" id="priceCaption1"></p>
          </div>

          <div class="price-divider">|</div>

          <div class="price-col price-col--secondary" id="priceCol2">
            <p class="price-col-title" id="priceLabel2">Ważność oferty</p>
            <div class="price-value-row">
              <span class="price-value price-value--small" id="priceValue2"></span>
            </div>
            <p class="price-col-caption" id="priceCaption2"></p>
          </div>
        </div>

        <div class="hero-actions">

          <button class="btn-hero" id="btnDetails">

            <span>Zobacz szczegóły</span>

            <svg viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>

          </button>

          <span class="hero-brandchip" id="heroBrandChip"></span>

        </div>

      </div>

    </div>

  </main>

  <!-- ============================================================ FOOTER / PROMO RAIL -->
  <footer class="promo-rail">
    <div class="filter-row" id="filterRow"></div>
    <div class="promo-row">
      <button class="promo-nav promo-prev" id="promoPrev" aria-label="Poprzednie"></button>
      <div class="promo-track-wrap" id="promoTrackWrap">
        <div class="promo-track" id="promoTrack"></div>
      </div>
      <button class="promo-nav promo-next" id="promoNext" aria-label="Następne"></button>
    </div>
  </footer>

  <!-- ============================================================ MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet" id="modalSheet">
      <div class="modal-grip"></div>
      <button class="modal-close" id="modalClose" aria-label="Zamknij"></button>
      <div class="modal-header" id="modalHeader"></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- ============================================================ ATTRACT / IDLE BADGE -->
  <div class="idle-badge" id="idleBadge">
    <span class="idle-dot"></span> Tryb prezentacji
  </div>

</div>

<script src="js/icons.js"></script>
<script src="js/logos.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
